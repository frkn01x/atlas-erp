map $uri $erp_web_area {
  ~^/api/ api;
  default frontend;
}
log_format erp_web escape=json '{"time":"$time_iso8601","source":"web","method":"$request_method","area":"$erp_web_area","status":$status,"duration":$request_time}';
upstream erp_api {
  zone erp_api 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  server api:3000 resolve;
}
server {
  listen 80;
  server_tokens off;
  access_log /var/log/erp/access.log erp_web;
  error_log /dev/stderr crit;
  root /usr/share/nginx/html;
  client_max_body_size 2m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ {
    proxy_pass http://erp_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_read_timeout 60s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
