# AI serbest metni kod ornekleri icerebilir. Yalnizca bu alanlarda SQLi/XSS
# eslesmeleri disarida; diger alanlar, diger saldiri siniflari ve API yetkisi aktiftir.
SecRule REQUEST_URI "@rx ^/api/(?:public/)?ai/(?:guide/chat|interviews(?:/[0-9a-f]{24}/answer)?)$" "id:100010,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.question,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.question,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.answer,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.answer,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.requirements,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.requirements"
# Adminin girdigi API ana adresi kod yurutmez; uygulama HTTPS, DNS ve IP siniri uygular.
SecRule REQUEST_URI "@rx ^/api/settings/(?:ai|iyzico|smtp)$" "id:100011,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:json.values.baseUrl,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:json.values.publicUrl"
