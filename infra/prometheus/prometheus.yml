global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: atlas-api
    static_configs:
      - targets: [api:9100]
  - job_name: waf
    static_configs:
      - targets: [nginx-exporter:9113]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
